# Tiny Tapeout project information
project:
  title:        "UWASIC Onboarding – SPI Peripheral"
  author:       "Tina Yaghchian"
  discord:      "tina_ygh"
  description:  "Write-only SPI peripheral with addressable registers and PWM output"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x1"

  top_module:  tt_um_spi_regs

  # Source files must be in ./src (so do NOT prefix with src/)
  source_files: [project.v]

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website.
pinout:
  # Inputs (ui_in[0] is LSB)
  ui[0]: "nCS"
  ui[1]: "COPI"
  ui[2]: "SCLK"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (uo_out[0] is LSB)
  uo[0]: "OUT0"
  uo[1]: "OUT1"
  uo[2]: "OUT2"
  uo[3]: "OUT3"
  uo[4]: "OUT4"
  uo[5]: "OUT5"
  uo[6]: "OUT6"
  uo[7]: "OUT7"

  # Bidirectional pins (uio[0] is LSB)
  uio[0]: "PWM"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
